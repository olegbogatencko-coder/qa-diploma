services:
  mysql:
    image: mysql:8.0
    container_name: mysql_diplom
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass

  postgres:
    image: postgres:13-alpine
    container_name: postgres_diplom
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass

  gate-simulator:
    image: node:14-alpine
    container_name: gate_simulator
    working_dir: /app
    volumes:
      - ./gate-simulator:/app
    command: node server.js
    ports:
      - "9999:9999"