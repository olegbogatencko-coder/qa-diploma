plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2' // Плагин для отчетов Allure
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 (фреймворк для тестов)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'

    // Selenide (для UI-тестов)
    testImplementation 'com.codeborne:selenide:6.17.2'

    // Allure (для красивых отчетов)
    testImplementation 'io.qameta.allure:allure-selenide:2.22.1'

    // Логирование (чтобы видеть в консоли, что происходит)
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'

    // Работа с базами данных (JDBC драйверы и утилиты)
    testImplementation 'mysql:mysql-connector-java:8.0.33'
    testImplementation 'org.postgresql:postgresql:42.6.0'
    testImplementation 'commons-dbutils:commons-dbutils:1.8.1'

    // Генерация случайных данных (для негативных тестов)
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
}

test {
    useJUnitPlatform()
    // Настройка для Selenide, чтобы в CI (GitHub Actions) тесты шли без экрана
    systemProperty 'selenide.headless', System.getProperty('selenide.headless')
}